<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>获取设备ID（复刻版）</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: #f8fafc;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 0;
    }
    .loader-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; background: white; padding: 32px 40px; border-radius: 36px;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,.08);
    }
    .loader {
      border: 4px solid #e2e8f0; border-radius: 50%; border-top-color: #10b981;
      width: 56px; height: 56px;
      animation: spin .7s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      color: #334155; font-size: 15px; font-weight: 500;
      background: #f1f5f9; padding: 8px 18px; border-radius: 40px;
    }
    .success-card {
      background: white; max-width: 480px; width: 90vw; border-radius: 48px;
      padding: 32px 24px 40px; box-shadow: 0 25px 45px -12px rgba(0,0,0,.2);
      text-align: center; animation: fadeSlideUp .4s cubic-bezier(.2,.9,.4,1.1);
    }
    @keyframes fadeSlideUp { from { opacity:0; transform: translateY(20px);} to { opacity:1; transform:none;} }
    .icon-circle {
      width: 80px; height: 80px; background: #10b981; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 20px -8px rgba(16,185,152,.35); margin-bottom: 20px;
    }
    .icon-circle svg { width: 44px; height: 44px; stroke: white; stroke-width: 2.5; }
    h2 { margin: 0 0 8px; font-size: 28px; font-weight: 700; color: #0f172a; }
    .sub { color: #475569; font-size: 15px; margin-bottom: 28px; }
    .id-card {
      background: #f1f5f9; border-radius: 28px; padding: 18px 20px;
      margin: 16px 0 24px; text-align: left; border: 1px solid #e2e8f0;
    }
    .id-label {
      font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
      color: #1e293b; background: #e2e8f0; display: inline-block;
      padding: 4px 12px; border-radius: 40px; margin-bottom: 12px;
    }
    .device-id-value {
      font-family: 'SF Mono','JetBrains Mono',monospace; font-size: 15px; font-weight: 500;
      word-break: break-all; background: #ffffffcc; padding: 12px 14px; border-radius: 20px;
      color: #0f172a; border: 1px solid #cbd5e1; margin: 8px 0 12px; line-height: 1.45;
    }
    .payload-value {
      font-family: 'SF Mono',monospace; font-size: 12px; word-break: break-all;
      background: #fff; padding: 10px 12px; border-radius: 14px;
      border: 1px solid #e2e8f0; color: #475569; white-space: pre-wrap;
    }
    .btn-copy {
      background: #0f172a; border: none; padding: 12px 20px; border-radius: 60px;
      font-weight: 600; font-size: 15px; color: white; cursor: pointer;
      display: inline-flex; align-items: center; gap: 10px; justify-content: center;
      width: 100%; transition: all .2s;
    }
    .btn-copy:hover { background: #1e293b; }
    .copy-feedback {
      font-size: 13px; color: #2e7d32; padding: 6px 14px; border-radius: 60px;
      font-weight: 500; opacity: 0; transition: opacity .2s; display: inline-block;
    }
    .footer-note {
      margin-top: 28px; font-size: 12px; color: #64748b;
      background: #f8fafc; padding: 10px 16px; border-radius: 60px; display: inline-block;
    }
    details.debug {
      margin-top: 20px; text-align: left; font-size: 12px; color: #64748b;
    }
    details.debug pre {
      background: #f1f5f9; border-radius: 14px; padding: 10px;
      white-space: pre-wrap; word-break: break-all; font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="appRoot">
    <div class="loader-container">
      <div class="loader"></div>
      <div class="loader-text">正在获取设备信息...</div>
    </div>
  </div>

  <script>
    /* =========================================================
     * 今日校园「扫码获取设备ID」复刻版
     * 原理：今日校园 App 内置 WebView 注入了 Cordova 桥接对象，
     * 通过官方公开的 cordova_*.js 调用原生插件 MAMPDevice.getDeviceInfo
     * 拿到 deviceId/uuid。
     *
     * !! 与原版区别：本页面不会把你的设备ID上报到任何第三方服务器 !!
     * 如需上报到自己的后端，改下面的 REPORT_URL（留空 = 不上报）
     * ========================================================= */
    var REPORT_URL = "";   // 例如 "https://你的域名/report.php"，留空则纯本地展示

    var lastDeviceId = null;
    var reported = false;

    function dbg(msg) { console.log('[DEV]', msg); }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"]/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m];
      });
    }

    /* ---------- 上报（可选，只发往 REPORT_URL） ---------- */
    function reportIfNeeded(payload) {
      if (!REPORT_URL || reported) return;
      reported = true;
      fetch(REPORT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: lastDeviceId, device_info: payload })
      }).catch(function (e) { dbg('上报失败: ' + e.message); });
    }

    /* ---------- 成功 UI ---------- */
    function showSuccessUI(deviceId, payload) {
      lastDeviceId = deviceId;
      var root = document.getElementById('appRoot');
      if (!root) return;
      var payloadStr = '';
      try { payloadStr = JSON.stringify(payload, null, 2); } catch (e) { payloadStr = String(payload); }
      root.innerHTML =
        '<div class="success-card">' +
          '<div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>' +
          '<h2>获取成功</h2>' +
          '<div class="sub">设备唯一标识如下，可复制用于配置</div>' +
          '<div class="id-card">' +
            '<div class="id-label">Device ID</div>' +
            '<div class="device-id-value" id="deviceIdText">' + escapeHtml(deviceId) + '</div>' +
            '<button class="btn-copy" id="copyBtn">复制设备ID</button>' +
            '<span id="copyFeedback" class="copy-feedback">已复制 ✓</span>' +
          '</div>' +
          '<div class="id-card">' +
            '<div class="id-label">完整设备信息</div>' +
            '<div class="payload-value">' + escapeHtml(payloadStr) + '</div>' +
          '</div>' +
          '<details class="debug"><summary>环境调试信息</summary><pre id="dbgInfo"></pre></details>' +
          '<div class="footer-note">本页面为本地复刻版 · 设备ID不会上传到任何第三方</div>' +
        '</div>';

      document.getElementById('dbgInfo').textContent =
        'UA: ' + navigator.userAgent + '\n' +
        'cordova: ' + (window.cordova ? '存在' : '不存在');

      var copyBtn = document.getElementById('copyBtn');
      var feedback = document.getElementById('copyFeedback');
      copyBtn.addEventListener('click', function () {
        var text = document.getElementById('deviceIdText').innerText;
        function done() {
          feedback.style.opacity = '1';
          setTimeout(function () { feedback.style.opacity = '0'; }, 1800);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text); done(); });
        } else { legacyCopy(text); done(); }
      });
      function legacyCopy(t) {
        var ta = document.createElement('textarea');
        ta.value = t; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      }
    }

    function showFailUI(reason) {
      var root = document.getElementById('appRoot');
      root.innerHTML =
        '<div class="success-card">' +
          '<div class="icon-circle" style="background:#f97316;"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div>' +
          '<h2>获取失败</h2>' +
          '<div class="sub">无法读取设备ID —— 大概率不在今日校园 App 环境内</div>' +
          '<div class="id-card">' +
            '<div class="id-label">原因</div>' +
            '<div class="payload-value">' + escapeHtml(reason) + '</div>' +
            '<button class="btn-copy" id="retryBtn" style="background:#334155; margin-top:12px;">重新尝试</button>' +
          '</div>' +
          '<details class="debug"><summary>环境调试信息</summary><pre id="dbgInfo"></pre></details>' +
        '</div>';
      document.getElementById('dbgInfo').textContent =
        'UA: ' + navigator.userAgent + '\n' +
        'cordova: ' + (window.cordova ? '存在' : '不存在') + '\n' +
        'BH_MOBILE: ' + (typeof BH_MOBILE !== 'undefined' ? '存在' : '不存在');
      document.getElementById('retryBtn').addEventListener('click', function () { location.reload(); });
    }

    /* ---------- 统一入口：拿到设备信息就展示 ---------- */
    var done = false;
    function onDeviceInfoReceived(res) {
      if (done) return;
      var id = null;
      if (typeof res === 'string') id = res;
      else if (res) id = res.uuid || res.deviceId || res.id || null;
      if (!id) { dbg('回调无有效ID: ' + JSON.stringify(res)); return; }
      done = true;
      if (!res.deviceId && !res.uuid) res = { deviceId: id, uuid: id, raw: res };
      showSuccessUI(id, res);
      reportIfNeeded(res);
    }

    /* ---------- 途径1: Cordova MAMPDevice 插件 ---------- */
    function invokeMAMPDevice() {
      if (!window.cordova || !window.cordova.exec) return;
      window.cordova.exec(
        function (res) { dbg('MAMPDevice 成功: ' + JSON.stringify(res)); onDeviceInfoReceived(res); },
        function (err) { dbg('MAMPDevice 失败: ' + JSON.stringify(err)); },
        'MAMPDevice', 'getDeviceInfo', []
      );
    }

    /* ---------- 途径2: BH_MOBILE 桥（老版本/个别环境） ---------- */
    function tryBHMobile() {
      try {
        if (typeof BH_MOBILE !== 'undefined' && BH_MOBILE.device && typeof BH_MOBILE.device.getDeviceId === 'function') {
          BH_MOBILE.device.getDeviceId(function (res) {
            dbg('BH_MOBILE 回调: ' + JSON.stringify(res));
            onDeviceInfoReceived(res);
          });
        }
      } catch (e) { dbg('BH_MOBILE 异常: ' + e.message); }
    }

    /* ---------- 途径3: window.device.uuid (cordova-plugin-device 风格) ---------- */
    function tryWindowDevice() {
      if (window.device && window.device.uuid) onDeviceInfoReceived({ deviceId: window.device.uuid, uuid: window.device.uuid });
    }

    /* ---------- 启动 ---------- */
    function bootstrap() {
      // 按平台加载今日校园官方公开的 Cordova 桥接脚本
      var isiOS = !!navigator.userAgent.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/);
      var s = document.createElement('script');
      s.src = isiOS
        ? 'https://static.campushoy.com/innerjs/cordova_ios.js'
        : 'https://static.campushoy.com/innerjs/cordova_android.js';
      document.head.appendChild(s);

      document.addEventListener('deviceready', function () { invokeMAMPDevice(); }, false);

      setTimeout(function () { if (!done) invokeMAMPDevice(); }, 300);   // 尝试1
      setTimeout(function () { if (!done) { invokeMAMPDevice(); tryBHMobile(); } }, 800);  // 尝试2
      setTimeout(function () { if (!done) tryWindowDevice(); }, 1200);   // 尝试3
      setTimeout(function () {   // 最终兜底
        if (!done) {
          invokeMAMPDevice(); tryBHMobile(); tryWindowDevice();
          if (!done) showFailUI('所有获取途径（MAMPDevice / BH_MOBILE / window.device）均无响应。' +
            '请在「今日校园」App 内使用扫一扫打开本页面，普通浏览器没有 Cordova 原生桥，拿不到设备ID。');
        }
      }, 2500);
    }

    bootstrap();
  </script>
</body>
</html>
